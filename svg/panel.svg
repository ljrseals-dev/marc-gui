<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="P455 MDN Sidecar PIXEL-DSP reconstruction">
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0e0c0a"/>
    </linearGradient>
    <radialGradient id="knobOrange" cx="42%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#ff8a40"/>
      <stop offset="55%" stop-color="#c45a20"/>
      <stop offset="100%" stop-color="#6a2808"/>
    </radialGradient>
    <radialGradient id="knobRed" cx="42%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#e06060"/>
      <stop offset="55%" stop-color="#a02828"/>
      <stop offset="100%" stop-color="#501010"/>
    </radialGradient>
  </defs>

  <!-- 01_PANEL_BG -->
  <rect x="0" y="0" width="920" height="520" fill="#1a1410"/>
  <rect x="8" y="8" width="904" height="504" fill="url(#panelGrad)"/>
  <!-- 1px filled edges (R2) -->
  <rect x="8" y="8" width="904" height="1" fill="#3a3530"/>
  <rect x="8" y="511" width="904" height="1" fill="#3a3530"/>
  <rect x="8" y="8" width="1" height="504" fill="#3a3530"/>
  <rect x="911" y="8" width="1" height="504" fill="#3a3530"/>

  <!-- meter_l_rms -->
  <g id="meter_l_rms">
    <rect x="24" y="24" width="148" height="112" fill="#12100e"/>
    <rect x="24" y="24" width="148" height="1" fill="#3a3530"/>
    <rect x="24" y="135" width="148" height="1" fill="#3a3530"/>
    <rect x="24" y="24" width="1" height="112" fill="#3a3530"/>
    <rect x="171" y="24" width="1" height="112" fill="#3a3530"/>
    <text x="36" y="42" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#c0b8a8">L</text>
    <text x="150" y="42" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#8a8070" text-anchor="end">dB</text>
    <text x="36" y="128" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#6a6050">RAW+IN</text>
    <text x="150" y="128" font-family="Helvetica,Arial,sans-serif" font-size="8" fill="#6a6050" text-anchor="end">OUTPUT</text>
  </g>

  <!-- meter_r_rms -->
  <g id="meter_r_rms">
    <rect x="184" y="24" width="148" height="112" fill="#12100e"/>
    <rect x="184" y="24" width="148" height="1" fill="#3a3530"/>
    <rect x="184" y="135" width="148" height="1" fill="#3a3530"/>
    <rect x="184" y="24" width="1" height="112" fill="#3a3530"/>
    <rect x="331" y="24" width="1" height="112" fill="#3a3530"/>
    <text x="196" y="42" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#c0b8a8">R</text>
  </g>

  <!-- knob_global_inout -->
  <g id="knob_global_inout">
    <ellipse cx="380" cy="58" rx="22" ry="22" fill="#2a2420"/>
    <ellipse cx="380" cy="58" rx="18" ry="18" fill="url(#knobOrange)"/>
    <rect x="379" y="42" width="2" height="14" fill="#f0e8d8"/>
    <text x="380" y="92" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#a09888" text-anchor="middle">INPUT</text>
  </g>

  <!-- knob_bias -->
  <g id="knob_bias">
    <ellipse cx="440" cy="58" rx="22" ry="22" fill="#2a2420"/>
    <ellipse cx="440" cy="58" rx="18" ry="18" fill="url(#knobRed)"/>
    <rect x="439" y="42" width="2" height="14" fill="#f0e8d8"/>
    <text x="440" y="92" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#a09888" text-anchor="middle">BIAS</text>
  </g>

  <!-- eq_bank frame -->
  <g id="eq_bank">
    <rect x="24" y="160" width="620" height="200" fill="#12100e"/>
    <rect x="24" y="160" width="620" height="1" fill="#3a3530"/>
    <rect x="24" y="359" width="620" height="1" fill="#3a3530"/>
    <rect x="24" y="160" width="1" height="200" fill="#3a3530"/>
    <rect x="643" y="160" width="1" height="200" fill="#3a3530"/>
  </g>

  <!-- comp_row frame -->
  <g id="comp_row">
    <rect x="24" y="380" width="620" height="112" fill="#12100e"/>
    <rect x="24" y="380" width="620" height="1" fill="#3a3530"/>
    <rect x="24" y="491" width="620" height="1" fill="#3a3530"/>
    <rect x="24" y="380" width="1" height="112" fill="#3a3530"/>
    <rect x="643" y="380" width="1" height="112" fill="#3a3530"/>
  </g>

  <!-- faders -->
  <g id="fader_output_l">
    <rect x="680" y="160" width="48" height="280" fill="#0a0908"/>
    <rect x="698" y="180" width="12" height="220" fill="#1a1816"/>
    <rect x="694" y="300" width="20" height="28" fill="#2a6a3a"/>
  </g>
  <g id="fader_output_r">
    <rect x="748" y="160" width="48" height="280" fill="#0a0908"/>
    <rect x="766" y="180" width="12" height="220" fill="#1a1816"/>
    <rect x="762" y="300" width="20" height="28" fill="#2a6a3a"/>
  </g>

  <!-- badge -->
  <text x="760" y="140" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c0b8a8" text-anchor="middle" font-weight="600">P455 MDN</text>
</svg>
